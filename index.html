<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "style.css>
    <title>AI Productivity Assistant</title>
</head>

<body>

    <header>
        <h1>AI Productivity Assistant</h1>
        <p>Your AI-powered assistant for everyday workplace tasks.</p>
    </header>

    <main>

        <section>
            <h2>What can I help you with?</h2>
            <p>Select a workplace task below.</p>
        </section>

        <section>
            
            <div>
                <h3>✉️ Email Generator</h3>
                <p>Create professional workplace emails with AI assistance.</p>
                <button>Email Generator</button>
            </div>

            <div>
                <h3>📝 Meeting Summarizer</h3>
                <p>Turn meeting notes into clear summaries and action items.</p>
                <button>Meeting Summarizer</button>
            </div>

            <div>
                <h3>✅ Task Planner</h3>
                <p>Break workplace goals into manageable tasks.</p>
                <button>Task Planner</button>
            </div>

            <div>
                <h3>🔎 Research Assistant</h3>
                <p>Organise information and assist with workplace research.</p>
                <button>Research Assistant</button>
            </div>

            <div>
                <h3>💬 AI Chatbot</h3>
                <p>Interact with an AI assistant for workplace support.</p>
                <button>Open AI Chat</button>
            </div>

        </section>

        <section>
            <h2>Responsible AI</h2>
            <p>
                AI-generated information may contain errors. Always review and
                verify AI outputs before using them. Do not enter confidential,
                sensitive, or personal information.
            </p>
        </section>

    </main>

    <footer>
        <p>AI Productivity Assistant | OnSite 2026</p>
        <p>Created by Nkosingiphile Dlamini</p>
    </footer>

</body>
</html>
